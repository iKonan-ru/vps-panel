<style>
:root{--bg:#0b0d12;--accent:#4f8cff;--ok:#3ecf8e;--text:#e8eaed;--muted:#7d8796}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;display:grid;place-items:center}
.mark{position:relative;display:flex;flex-direction:column;align-items:center;gap:28px;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.logo{width:132px;height:132px;filter:drop-shadow(0 18px 48px rgba(79,140,255,.35)) drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.led{animation:led 3.2s ease-in-out infinite}
.led.b{animation-delay:1.6s}
.name{font-size:30px;font-weight:600;letter-spacing:.02em;line-height:1}
.name b{font-weight:600;color:var(--accent)}
@keyframes led{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:480px){.logo{width:104px;height:104px}.name{font-size:24px}.mark{gap:22px}}
</style>
</head>

<main class="mark">
<svg class="logo" viewBox="0 0 512 512" role="img" aria-label="VPS Panel">

<rect width="512" height="512" rx="112" fill="url(#g)"/>
<rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3"/>
<rect x="112" y="150" width="288" height="88" rx="22" fill="none" stroke="#4f8cff" stroke-width="30"/>
<rect x="112" y="274" width="288" height="88" rx="22" fill="none" stroke="#4f8cff" stroke-width="30"/>
<circle class="led" cx="336" cy="194" r="20" fill="#3ecf8e"/>
<circle class="led b" cx="336" cy="318" r="20" fill="#3ecf8e"/>
<rect x="160" y="182" width="56" height="24" rx="12" fill="#4f8cff"/>
<rect x="160" y="306" width="56" height="24" rx="12" fill="#4f8cff"/>
</svg>
<div class="name">VPS <b>Panel</b></div>
</main>
