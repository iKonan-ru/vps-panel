<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable-иконка PWA (Android): фон сплошной до краёв, форму задаёт маска лаунчера.
       Значок тот же, что в icon.svg, уменьшен до 0.85 и целиком внутри безопасного круга
       (радиус 40% стороны). PNG: inkscape tools/icons/icon-maskable.svg -w 512 -h 512
       -o apps/web/public/icon-maskable-512.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f2b"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.85) translate(-256 -256)">
    <rect x="112" y="150" width="288" height="88" rx="22" fill="none" stroke="#4f8cff" stroke-width="30"/>
    <rect x="112" y="274" width="288" height="88" rx="22" fill="none" stroke="#4f8cff" stroke-width="30"/>
    <circle cx="336" cy="194" r="20" fill="#3ecf8e"/>
    <circle cx="336" cy="318" r="20" fill="#3ecf8e"/>
    <rect x="160" y="182" width="56" height="24" rx="12" fill="#4f8cff"/>
    <rect x="160" y="306" width="56" height="24" rx="12" fill="#4f8cff"/>
  </g>
</svg>
