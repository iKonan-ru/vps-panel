# fail2ban filter для панели: неудачные попытки входа пишутся Caddy в access.log.
# /etc/fail2ban/filter.d/vps-panel.conf
[Init]
# Caddy пишет время в середине JSON-строки ("ts":1791050249.31), а стандартный поиск даты ищет
# его в начале строки: без шаблона строки без даты пропускаются.
datepattern = "ts":{EPOCH}

[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"uri":"/api/auth/(login|totp)".*"status":(401|429).*$
ignoreregex =
