# Журналы контейнеров (stdout) - с ротацией: в docker по умолчанию растут без предела.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# Панель: Caddy (HTTPS) + panel (Node). Данные в ./data (владелец uid 1000 - пользователь node в контейнере).
# Запуск: cp .env.example .env; отредактировать; mkdir -p data && chown 1000:1000 data; docker compose up -d --build
services:
  panel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PANEL_HOST: 0.0.0.0
      PANEL_PORT: "3000"
      PANEL_PUBLIC_URL: https://${PANEL_DOMAIN}
      # подписки и личные страницы клиентов на своём имени (sub.example.com); пусто - адрес панели
      SUB_DOMAIN: ${SUB_DOMAIN:-}
      SESSION_SECRET: ${SESSION_SECRET}
      DATA_DIR: /data
      WEB_DIST: /app/web
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AGENT_DIR: /agent-dist
      FILES_DIR: /files
      # Внешний HTTP-прокси для Telegram, если не хочется встроенного xray (Настройки -> Маршрут до Telegram)
      TG_PROXY_URL: ${TG_PROXY_URL:-}
    volumes:
      - ./data:/data
      - ./agent-dist:/agent-dist:ro
      - ./files:/files:ro
    expose:
      - "3000"
    # Без привилегий ядра, без повышения прав, корень только для чтения. Пишет панель
    # только в /data и /tmp (снимок базы для бэкапа панели, единицы МБ; tmpfs входит в mem_limit).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # + xray-клиент внутри контейнера (около 30 МБ)
    mem_limit: 320m
    logging: *logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN}
      # без своего имени подписок блок Caddy слушает sub.localhost (снаружи не используется)
      SUB_DOMAIN: ${SUB_DOMAIN:-sub.localhost}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - panel
    # Из привилегий - только порты 80 и 443 (caddy работает от root, а cap_drop снимает и
    # файловую capability бинарника); пишет только в тома /data и /config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 128m
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
