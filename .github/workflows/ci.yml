# Проверки на каждый push и pull request: то же, что tools/check.sh (без закрытых строк
# своей установки): протокол, типы, biome, типографика интерфейса, тесты сервера, агент,
# символы в файлах.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: зависимости без High
        run: pnpm audit --prod --audit-level=high
      - run: pnpm --filter @vps/protocol build
      - run: pnpm -r --filter @vps/protocol --filter @vps/server --filter @vps/web exec tsc --noEmit
      - run: npx biome check apps/web/src apps/server/src apps/server/test packages/protocol/src
      - run: node tools/check-typography.mjs apps/web/src
      - run: npx vitest run
        working-directory: apps/server
      - run: pnpm --filter @vps/web build

  agent:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # последний стабильный Go: им собираются и установки (сборка Caddy naive требует новый)
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache-dependency-path: apps/agent/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: make build-all

  text:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: только клавиатурные символы в своих файлах
        run: |
          bad="$(git ls-files | grep -v -E '^deploy/files/' | xargs -d '\n' grep -IlP '[^\x00-\x7F\p{Cyrillic}]' || true)"
          if [ -n "$bad" ]; then echo "неклавиатурные символы: $bad"; exit 1; fi
